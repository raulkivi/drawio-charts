name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Validate plugin and marketplace manifests (claude plugin validate)
        run: |
          npx --yes @anthropic-ai/claude-code@2.1.295 plugin validate --strict .claude-plugin/plugin.json
          npx --yes @anthropic-ai/claude-code@2.1.295 plugin validate --strict .

      - name: Validate JSON manifests
        run: |
          python3 -c "import json; json.load(open('.claude-plugin/plugin.json'))"
          python3 -c "import json; json.load(open('.claude-plugin/marketplace.json'))"

      - name: Unit tests (validator, decompressor, skill docs and examples)
        run: python3 -m unittest discover -s tests -v

      - name: Validate example diagrams
        run: python3 skills/drawio-charts/scripts/validate_drawio.py skills/drawio-charts/assets/examples/*.drawio

      - name: Check skill/plugin symlink is intact
        run: |
          test -L .claude/skills/drawio-charts
          test -d .claude/skills/drawio-charts
          echo "symlink OK"
