name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Validate plugin and marketplace manifests (claude plugin validate)
        run: |
          npx --yes @anthropic-ai/claude-code@2.1.295 plugin validate --strict .claude-plugin/plugin.json
          npx --yes @anthropic-ai/claude-code@2.1.295 plugin validate --strict .

      - name: Validate JSON manifests
        run: |
          python3 -c "import json; json.load(open('.claude-plugin/plugin.json'))"
          python3 -c "import json; json.load(open('.claude-plugin/marketplace.json'))"

      - name: Validate SKILL.md frontmatter
        run: |
          python3 - <<'EOF'
          import pathlib, sys

          skill = pathlib.Path("skills/drawio-charts/SKILL.md").read_text()
          assert skill.startswith("---\n"), "SKILL.md must start with YAML frontmatter"
          end = skill.index("\n---", 4)
          frontmatter = skill[4:end]
          assert "name:" in frontmatter, "SKILL.md frontmatter missing 'name'"
          assert "description:" in frontmatter, "SKILL.md frontmatter missing 'description'"
          print("SKILL.md frontmatter OK")
          EOF

      - name: Validate .drawio example XML
        run: |
          python3 - <<'EOF'
          import glob
          import xml.dom.minidom as minidom

          files = glob.glob("skills/drawio-charts/**/*.drawio", recursive=True)
          assert files, "no .drawio example files found"
          for f in files:
              minidom.parse(f)
              print(f"{f}: well-formed XML")
          EOF

      - name: Check skill/plugin symlink is intact
        run: |
          test -L .claude/skills/drawio-charts
          test -d .claude/skills/drawio-charts
          echo "symlink OK"
